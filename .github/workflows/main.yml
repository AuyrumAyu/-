name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода из репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Компиляция мода (.jar)
        run: gradle build

      - name: Загрузка готового .jar файла в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetheriumOverlord-Mod-1.20.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-slim.jar

            !build/libs/*-sources.jar
            !build/libs/*-slim.jar
